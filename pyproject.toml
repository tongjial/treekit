[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treekit"
dynamic = ["version"]
description = "A toolkit for the mass trees manipulation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "dendropy>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
treekit = "treekit:main"

[tool.setuptools]
py-modules = ["treekit"]

[tool.setuptools.dynamic]
version = {attr = "treekit.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
